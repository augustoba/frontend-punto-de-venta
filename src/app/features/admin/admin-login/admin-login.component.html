<section class="min-h-screen flex items-center justify-center bg-brand-50 px-4">
  <form
    (ngSubmit)="submit()"
    class="w-full max-w-sm bg-white rounded-2xl shadow-sm ring-1 ring-black/5 p-8"
  >
    <div class="text-center mb-6">
      <img [src]="logoSrc() | cldImg: 120" alt="Logo" class="h-14 w-14 rounded-full object-cover mx-auto ring-1 ring-brand-100 bg-white" />
      <h1 class="font-display font-extrabold text-xl text-stone-800 mt-2">Panel de administración</h1>
    </div>

    <label class="block text-sm font-semibold text-stone-700 mb-1.5" for="dni">DNI</label>
    <input
      id="dni"
      type="text"
      inputmode="numeric"
      required
      [ngModel]="dni()"
      (ngModelChange)="dni.set($event)"
      name="dni"
      class="w-full rounded-lg border border-stone-200 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 mb-4"
    />

    <label class="block text-sm font-semibold text-stone-700 mb-1.5" for="password">Contraseña</label>
    <input
      id="password"
      type="password"
      required
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      name="password"
      class="w-full rounded-lg border border-stone-200 px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400"
    />

    @if (error()) {
      <p class="text-sm text-red-500 font-semibold mt-3">DNI o contraseña incorrectos.</p>
    }

    @if (blocked()) {
      <p class="text-sm text-red-500 font-semibold mt-3">
        {{ blockedMessage() }}
        <span class="block text-stone-500 font-normal">Podés reintentar en {{ blockedLabel() }}.</span>
      </p>
    }

    <button
      type="submit"
      [disabled]="loading() || blocked()"
      class="w-full mt-6 bg-brand-500 hover:bg-brand-600 disabled:bg-stone-300 disabled:cursor-wait text-white font-bold py-2.5 rounded-full transition-colors"
    >
      {{ loading() ? 'Ingresando…' : blocked() ? 'Bloqueado (' + blockedLabel() + ')' : 'Ingresar' }}
    </button>

    <a routerLink="/admin/recuperar" class="block text-center text-sm text-brand-600 hover:underline font-semibold mt-4">
      ¿Olvidaste tu contraseña?
    </a>
    <a routerLink="/" class="block text-center text-sm text-stone-400 hover:text-stone-600 mt-2">
      ← Volver a la tienda
    </a>
  </form>
</section>
